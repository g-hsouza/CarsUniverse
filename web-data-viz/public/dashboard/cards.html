<body onload="exibirAquarios(),  atualizacaoPeriodica()">

    <div class="janela">

        <div class="header-left dash-header">

            <img src="../assets/imgs/logo_carsUniverse.png" alt="" width="150px" height="100px">

            <!-- <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div> -->
            <div class="botoes-nav">
                <div class="btn-nav">
                    <h3>Dashboard</h3>
                </div>

                <div class="btn-nav-white">
                    <a href="./dashboard.html">
                        <h3>Quiz</h3>
                    </a>
                </div>

                <div class="btn-nav-white">
                    <a href="./mural.html">
                        <h3>Perfil</h3>
                    </a>
                </div>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">

            <div class="topo-dash">
                <div class="titulo-dash">
                    <h1>DASHBOARD</h1>
                    <p>Olá, <span id="b_usuario">usuário</span>!</p>
                </div>

                <div class="icon-perfil">
                    <a href="">
                        <img src="../assets/imgs/icone.png" alt="" width="50px" height="50px">
                    </a>
                </div>
            </div>

            <div class="div-kpis">

                <div class="kpi kpi-red">
                    <h5>Total de quizzes realizados</h5>
                    <h1>5</h1>
                    <h5>Conhecimento + Personalidade</h5>
                </div>

                <div class="kpi">
                    <h5>Taxa de acerto atual</h5>
                    <h1>92,6%</h1>
                    <h5>Quiz de conhecimento</h5>
                </div>

                <div class="kpi">
                    <h5>Seu personagem</h5>
                    <h1 class="h1-personagem">McQueen</h1>
                    <h5>Último resultado de personalidade</h5>
                </div>


            </div>

            <div class="div-graphs">
                <div class="graph">
                    <h5>Desempenho por Categoria</h5>
                </div>

                <div class="graph">
                    <h5>Evolução Taxa de Acerto</h5>
                </div>
            </div>

        </div>

    </div>

</body>

<script>

    function exibirAquarios() {
        JSON.parse(sessionStorage.AQUARIOS).forEach(item => {
            document.getElementById("cardAquarios").innerHTML += `
                    <div class="card-aquario">
                        <div class="title-aquario">
                            <h1>${item.descricao}</h1>
                        </div>
                        <div class="desc-aquario">
                        <div class="temperatura">
                            <p id="temp_aquario_${item.id}">-°C</p>
                        </div>
                        <div class="cor-alerta" id="card_${item.id}"></div>
                    </div>
                    </div>
                    `
        });
    }

</script>

</html>
