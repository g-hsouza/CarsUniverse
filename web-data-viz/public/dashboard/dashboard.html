<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarsUniverse | Dashboard</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body onload="exibirAquarios(),  atualizacaoPeriodica()">
    <!-- validarSessao(), -->
    <div class="janela">

        <div class="header-left dash-header">

            <img src="../assets/imgs/logo_carsUniverse.png" alt="" width="150px" height="100px">

            <div class="botoes-nav">
                <div class="btn-nav">
                    <h3>Dashboard</h3>
                </div>

                <a href="quiz.html">
                    <div class="btn-nav-white">
                        <h3>Quiz</h3>
                    </div>
                </a>

                <a href="perfil.html">
                    <div class="btn-nav-white">
                        <h3>Perfil</h3>
                    </div>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">

            <div class="topo-dash">
                <div class="titulo-dash">
                    <h1>DASHBOARD</h1>
                    <p>Olá, <span id="b_usuario">usuário</span>!</p>
                </div>

                <div class="icon-perfil">
                    <a href="perfil.html">
                        <img src="../assets/imgs/icone.png" alt="" width="50px" height="50px">
                    </a>
                </div>
            </div>

            <div class="div-kpis">

                <div class="kpi kpi-red">
                    <h5>Total de quizzes realizados</h5>
                    <h1>5</h1>
                    <h5>Conhecimento + Personalidade</h5>
                </div>

                <div class="kpi">
                    <h5>Taxa de acerto atual</h5>
                    <h1>78,5%</h1>
                    <h5>Quiz de conhecimento</h5>
                </div>

                <div class="kpi">
                    <h5>Seu personagem</h5>
                    <h1 class="h1-personagem">McQueen</h1>
                    <h5>Último resultado de personalidade</h5>
                </div>


            </div>

            <div class="div-graphs">
                <div class="graph">
                    <h5>Desempenho por Categoria</h5>
                    <div>
                        <canvas id="chartCategorie"></canvas>
                    </div>
                </div>

                <div class="graph">
                    <h5>Evolução Taxa de Acerto</h5>
                    <div>
                        <canvas id="chartEvolution"></canvas>
                    </div>
                </div>
            </div>

        </div>

    </div>

</body>

<script>
    const chartCategorie = document.getElementById('chartCategorie');
    const chartEvolution = document.getElementById('chartEvolution');


    new Chart(chartCategorie, {
        type: 'bar',
        data: {
            labels: ['Personagens', 'Filmes', 'Corridas', 'Lugares'],
            datasets: [{
                label: 'Taxa Acerto',
                data: [92, 85, 78, 65],
                backgroundColor: 'rgba(245, 197, 66, 0.5)',
                borderColor: 'rgba(245, 197, 66, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    min: 0,
                    max: 100,
                    ticks: {
                        stepSize: 25,
                        callback: function (value) {
                            return value + '%';
                        }
                    }
                }
            }
        }
    });

    new Chart(chartEvolution, {
        type: 'line',
        data: {
            labels: ['1ª', '2ª', '3ª', '4ª', '5ª'],
            datasets: [{
                label: 'Taxa Acerto',
                data: [68, 72.5, 75, 82, 95],
                backgroundColor: 'rgba(245, 197, 66, 0.5)',
                borderColor: 'rgba(245, 197, 66, 1)',
                borderWidth: 1
            }]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true,
                    min: 0,
                    max: 100,
                    ticks: {
                        stepSize: 25,
                        callback: function (value) {
                            return value + '%';
                        }
                    }
                }
            }
        }
    });



</script>

</html>
