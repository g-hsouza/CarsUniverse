        rel="stylesheet">

<body onload="buscarHistorico(), validarSessao()">

    <div class="janela">

        <div class="header-left dash-header">

            <img src="../assets/imgs/logo_carsUniverse.png" alt="" width="150px" height="100px">

            <div class="botoes-nav">
                <a href="dashboard.html">
                    <div class="btn-nav-white">
                        <h3>Dashboard</h3>
                    </div>
                </a>

                <a href="quiz.html">
                    <div class="btn-nav">
                        <h3>Quiz</h3>
                    </div>
                </a>

                <a href="perfil.html">
                    <div class="btn-nav-white">
                        <h3>Perfil</h3>
                    </div>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">

            <div class="topo-dash">
                <div class="titulo-dash">
                    <h1>HISTÓRICO DE QUIZ</h1>
                    <p>Confira todos os quizzes realizados!</p>
                </div>

                <div class="icon-perfil">
                    <a href="perfil.html">
                        <img src="../assets/imgs/icone.png" alt="" width="50px" height="50px" id="foto-perfil">
                    </a>
                </div>
            </div>

            <div id="msg-historico" style="display: flex;">
                <h1>Nenhum quiz foi realizado!</h1>
            </div>

            <div class="container-tabela" id="tabela" style="display: none;">
                <table class="tabela-historico">
                    <thead>
                        <tr>
                            <th>QUIZ</th>
                            <th>RESULTADO</th>
                            <th>DATA</th>
                        </tr>
                    </thead>
                    <tbody id="listaHistorico">

                    </tbody>
                </table>
            </div>





        </div>

    </div>


</body>

</html>

<script>

    function buscarHistorico() {
        try {
            var idUsuario = sessionStorage.ID_USUARIO;
            if (idUsuario) {
                fetch(`/dashboard/buscarHistorico?id=${idUsuario}`, {
                    method: 'GET'
                }).then(function (res) {
                    if (res.ok) {
                        console.log('Dados obtidos com sucesso');
                        return res.json();
                    } throw new Error('Erro ao buscar dados');
                })

                    .then(function (dados) {

                        var listaHistorico = document.getElementById("listaHistorico");
                        listaHistorico.innerHTML = "";

                        if (dados.length == 0) {
                            document.getElementById("msg-historico").style.display = "flex";
                            document.getElementById("tabela").style.display = "none";
                        } else {
                            document.getElementById("msg-historico").style.display = "none";
                            document.getElementById("tabela").style.display = "flex";
                        }

                        for (var i = 0; i < dados.length; i++) {

                            listaHistorico.innerHTML += `
                                <tr>
                                    <td>${dados[i]["Tipo de Quiz"]}</td>
                                    <td>${dados[i]["Resultado"]}</td>
                                    <td>${dados[i]["Data"]}</td>
                                </tr>
                            `;
                        }

                    }).catch(function (erro) {
                        console.log(erro);
                    });

            } else {
                console.log('Usuário não está logado');
            }
        } catch (e) {
            console.error('Erro ao buscar dados', e);
        }
    }
</script>
