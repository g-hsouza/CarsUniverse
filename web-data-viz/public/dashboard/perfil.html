<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarsUniverse | Perfil</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao(), atualizarFeed()">

    <div class="janela">

        <div class="header-left dash-header">

            <img src="../assets/imgs/logo_carsUniverse.png" alt="" width="150px" height="100px">

            <div class="botoes-nav">
                <a href="dashboard.html">
                    <div class="btn-nav-white">
                        <h3>Dashboard</h3>
                    </div>
                </a>

                <a href="quiz.html">
                    <div class="btn-nav-white">
                        <h3>Quiz</h3>
                    </div>
                </a>

                <div class="btn-nav">
                    <h3>Perfil</h3>
                </div>

            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>

        <div class="dash">

            <div class="topo-dash">
                <div class="titulo-dash">
                    <h1>PERFIL</h1>
                    <p>Personalize seu perfil!</p>
                </div>
            </div>

            <div class="container-perfil">
                <div class="form-perfil">
                    <div class="foto-usuario">
                        <label for="input-foto">
                            <div class="fotos-usuario">
                                <img src="../assets/imgs/editar.png" alt="" width="30px" height="30px" id="img-editar">
                                <img src="../assets/imgs/icone.png" alt="" width="120px" height="120px" id="foto-perfil"
                                    class="foto-perfil">
                            </div>
                        </label>

                        <input type="file" id="input-foto" accept="image/*" onchange="exibirPreview(event)" hidden>
                    </div>

                    <div class="campos-perfil">
                        <input type="text" class="ipt-perfil" id="ipt_nome">
                        <input type="text" class="ipt-perfil" id="ipt_email">
                        <button class="btn-perfil" onclick="abrirModalSenha()">Alterar Senha</button>
                    </div>

                    <div class="btns-perfil">
                        <button class="btn-perfil-salvar" onclick="salvarAlteracoes()">Salvar Alterações</button>
                    </div>
                </div>
            </div>


            <div id="modalSenha" class="modal">

                <div class="card-senha">

                    <span class="fechar" onclick="fecharModalSenha()">X</span>

                    <h2>Alterar Senha</h2>

                    <input type="password" id="ipt_senhaAtual" placeholder="Senha atual">

                    <input type="password" id="ipt_novaSenha" placeholder="Nova senha" onkeyup="mostrarSenha()">
                    <p class="p-senha"><span id="senha_8caracteres">✗ 8+ caracteres</span> | <span
                            id="senha_maiuscula">✗ Letra
                            maiúscula</span> | <span id="senha_minuscula">✗ Letra minúscula</span> | <span
                            id="senha_especial">✗
                            Caractere especial</span></p>

                    <input type="password" id="ipt_confirmacaoSenha" placeholder="Confirmar nova senha"
                        onkeyup="verificarSenha()">
                    <p id="p_confirmacaoSenha"></p>

                    <button onclick="alterarSenha()"> Confirmar Alteração</button>

                </div>

            </div>

</body>

</html>

<script>
    ipt_nome.value = sessionStorage.NOME_USUARIO;
    ipt_email.value = sessionStorage.EMAIL_USUARIO;

    function exibirPreview(event) {

        var arquivo = event.target.files[0];

        if (arquivo) {

            var leitor = new FileReader();

            leitor.onload = function () {
                document.getElementById('foto-perfil').src = leitor.result;
            };

            leitor.readAsDataURL(arquivo);
        }
    }

    function abrirModalSenha() {
        document.getElementById('modalSenha').style.display = 'flex';
    }

    function fecharModalSenha() {
        document.getElementById('modalSenha').style.display = 'none';
    }

    function mostrarSenha() {
        var senha = ipt_novaSenha.value.trim();
        var senhaUpper = senha.toUpperCase();
        var senhaLower = senha.toLowerCase();
        var temEspecial = senha.includes('!') || senha.includes('*') || senha.includes('.') || senha.includes('@') || senha.includes('#') || senha.includes('$');

        if (temEspecial) {
            senha_especial.innerHTML = `<span style="color: #2E9B68;">✓ Caractere especial</span>`
        } else {
            senha_especial.innerHTML = `<span style="color: #8B929B;">✗ Caractere especial</span>`
        }

        if (senha != senhaUpper) {
            senha_minuscula.innerHTML = `<span style="color: #2E9B68;">✓ Letra minúscula</span>`
        } else {
            senha_minuscula.innerHTML = `<span style="color: #8B929B;">✗ Letra minúscula</span>`
        }

        if (senha != senhaLower) {
            senha_maiuscula.innerHTML = `<span style="color: #2E9B68;">✓ Letra maiúscula</span>`
        } else {
            senha_maiuscula.innerHTML = `<span style="color: #8B929B;">✗ Letra maiúscula</span>`
        }

        if (senha.length >= 8) {
            senha_8caracteres.innerHTML = `<span style="color: #2E9B68;">✓ 8+ caracteres</span>`
        } else {
            senha_8caracteres.innerHTML = `<span style="color: #8B929B;">✗ 8+ caracteres</span>`
        }
    }

    function verificarSenha() {
        var senha = ipt_novaSenha.value.trim();
        var confirmacaoSenha = ipt_confirmacaoSenha.value.trim();

        if (senha != confirmacaoSenha) {
            p_confirmacaoSenha.innerHTML = `<span style="color: #E82127;">✗ Senhas não coincidem</span>`
        } else {
            p_confirmacaoSenha.innerHTML = `<span style="color: #2E9B68;">✓ Senhas coincidem</span>`
        }
    }

    function salvarAlteracoes() {
        var nomeAtualizado = ipt_nome.value.trim()
        var emailAtualizado = ipt_email.value.trim();

        try {
            var idUsuario = sessionStorage.ID_USUARIO;

            if (idUsuario) {

                var formulario = new FormData();

                formulario.append('id', idUsuario);
                formulario.append('nomeAtualizado', nomeAtualizado);
                formulario.append('emailAtualizado', emailAtualizado);

                var foto = document.getElementById('input-foto').files[0];

                if (foto) {
                    formulario.append('fotoPerfil', foto);
                }

                fetch('/usuarios/atualizar', {
                    method: 'PUT',
                    body: formulario
                }).then(function (res) {
                    if (res.ok) {

                        sessionStorage.NOME_USUARIO = nomeAtualizado;
                        sessionStorage.EMAIL_USUARIO = emailAtualizado;

                        res.json().then(function (dados) {

                            if (dados.fotoPerfil) {
                                sessionStorage.FOTO_PERFIL = dados.fotoPerfil;

                                var imagem = document.getElementById('foto-perfil');

                                imagem.src = `/uploads/${dados.fotoPerfil}?t=${new Date().getTime()}`;
                            }

                            console.log('Dados atualizados com sucesso');
                            alert("Dados atualizados com sucesso!");

                        });

                    } else {
                        res.text().then(function (txt) { console.error('Erro ao atualizar dados:', txt); });
                    }
                }).catch(function (err) { console.error('Erro ao atualizar dados:', err); });
            } else {
                console.log('Usuário não está logado');
            }
        } catch (e) {
            console.error('Erro ao tentar atualizar os dados', e);
        }
    }

    function alterarSenha() {
        var senhaAtual = ipt_senhaAtual.value.trim();
        var novaSenha = ipt_novaSenha.value.trim();
        var confirmacaoSenha = ipt_confirmacaoSenha.value.trim();

        var senhaUpper = novaSenha.toUpperCase();
        var senhaLower = novaSenha.toLowerCase();
        var temEspecial = novaSenha.includes('!') || novaSenha.includes('*') || novaSenha.includes('.') || novaSenha.includes('@') || novaSenha.includes('#') || novaSenha.includes('$');

        var senhaValida = novaSenha.length >= 8 && novaSenha != senhaUpper && novaSenha != senhaLower && temEspecial;

        if (!senhaValida) {
            alert("A senha não atende os requisitos!")
        } else if (novaSenha != confirmacaoSenha) {
            alert("As senhas não coincidem!")
        } else {

            try {
                var idUsuario = sessionStorage.ID_USUARIO;
                if (idUsuario) {
                    fetch('/usuarios/alterarSenha', {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            id: idUsuario,
                            senhaAtual: senhaAtual,
                            novaSenha: novaSenha
                        })
                    }).then(function (res) {
                        if (res.ok) {
                            console.log('Dados atualizados com sucesso');
                            alert("Senha alterada com sucesso!")
                            fecharModalSenha();
                        } else {
                            res.text().then(function (txt) { console.error('Erro ao atualizar dados:', txt); });
                            alert("Senha atual incorreta ou erro ao alterar!")
                        }
                    }).catch(function (err) { console.error('Erro ao alterar senha:', err); });
                } else {
                    console.log('Usuário não está logado');
                }
            } catch (e) {
                console.error('Erro ao tentar alterar senha', e);
            }


        }
    }

</script>
