<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cadastro | Cars Universe</title>

  <script src="./js/sessao.js"></script>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/styleLogin.css" />
  <link rel="icon" href="../assets/imgs/logo_carsUniverse.png">
</head>

<body>

  <div class="alerta_erro">
    <div class="card_erro" id="cardErro">
      <span id="mensagem_erro"></span>
    </div>
  </div>

  <div class="formulario">
    <h1>Crie sua <span style="color: #E82127;">conta</span></h1>

    <div class="campos-formulario">
      <div class="campo">
        <label for="ipt_nome">Nome</label>
        <input type="text" id="ipt_nome" placeholder="Nome">
      </div>

      <div class="campo">
        <label for="ipt_email">E-mail</label>
        <input type="text" id="ipt_email" placeholder="nome@email.com">
      </div>

      <div class="campo">
        <label for="ipt_senha">Senha</label>
        <input type="password" id="ipt_senha" onkeyup="mostrarSenha()" placeholder="Digite sua senha">
        <p class="p-senha"><span id="senha_8caracteres">✗ 8+ caracteres</span> | <span id="senha_maiuscula">✗ Letra
            maiúscula</span> | <span id="senha_minuscula">✗ Letra minúscula</span> | <span id="senha_especial">✗
            Caractere especial</span></p>
      </div>

      <div class="campo">
        <label for="ipt_confirmacaoSenha">Confirmar senha</label>
        <input type="password" id="ipt_confirmacaoSenha" placeholder="Confirme a senha">
      </div>
      <div id="div_nulos"></div>
    </div>

    <button class="button-cadastro" onclick="cadastrar()">Cadastrar</button>

    <p class="p-login">Já tem uma conta? <a href="login.html" style="color: #E82127;"><b>Entrar</b></a></p>
  </div>


</body>

</html>

<script>

  function cadastrar() {
    var nome = ipt_nome.value.trim();
    var email = ipt_email.value.trim();
    var temArroba = email.includes('@');
    var temPonto = email.includes('.');
    var indexArroba = email.indexOf('@');
    var indexPontoCom = email.indexOf('.com');
    var senha = ipt_senha.value.trim();
    var senhaUpper = senha.toUpperCase();
    var senhaLower = senha.toLowerCase();
    var temEspecial = senha.includes('!') || senha.includes('*') || senha.includes('.') || senha.includes('@') || senha.includes('#') || senha.includes('$');
    var confirmacaoSenha = ipt_confirmacaoSenha.value.trim();

    var campos = [nome, email, senha, confirmacaoSenha]
    var i = 0;

    var nomeValido = nome.length > 1;
    var emailValido = temArroba && temPonto && indexPontoCom > indexArroba + 1 && indexArroba > 0;
    var senhaValida = senha.length >= 8 && senha != senhaUpper && senha != senhaLower && temEspecial;
    var confirmacaoSenhaValida = confirmacaoSenha == senha;

    for (i = 0; i < campos.length && campos[i] != ''; i++) {

    }

    if (i < campos.length) {

      div_nulos.innerHTML = `<span style="color: red;">Preencha todos os campos!</span>`
      
    } else {
      if (!nomeValido) {
        alert('O nome não é válido.')
      } else if (!emailValido) {
        alert('O e-mail não é válido.')
      } else if (!senhaValida) {
        alert('A senha não é valida')
      } else if (!confirmacaoSenhaValida) {
        alert('As senhas não coincidem.')
      } else {

        fetch("/usuarios/cadastrar", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            nomeServer: nome,
            emailServer: email,
            senhaServer: senha,
          }),
        })
          .then(function (resposta) {
            console.log("resposta: ", resposta);

            if (resposta.ok) {
              cardErro.style.display = "block";
              cardErro.style.backgroundColor = "#2E9B68";
              mensagem_erro.innerHTML = "✔ Cadastro realizado com sucesso! Redirecionando...";

              setTimeout(() => {
                window.location = "login.html";
              }, "2000");

              limparFormulario();
              finalizarAguardar();
            } else {
              cardErro.style.display = "block";
              cardErro.style.backgroundColor = "#FF6347";
              mensagem_erro.innerHTML = "E-mail já cadastrado no sistema.";

              setTimeout(sumirMensagem, 5000);
            }
          })
          .catch(function (resposta) {
            console.log(`#ERRO: ${resposta}`);
            finalizarAguardar();
          });

        return false;



      }
    }
  }

  function mostrarSenha() {
    var senha = ipt_senha.value.trim();
    var senhaUpper = senha.toUpperCase();
    var senhaLower = senha.toLowerCase();
    var temEspecial = senha.includes('!') || senha.includes('*') || senha.includes('.') || senha.includes('@') || senha.includes('#') || senha.includes('$');

    if (temEspecial) {
      senha_especial.innerHTML = `<span style="color: #2E9B68;">✓ Caractere especial</span>`
    } else {
      senha_especial.innerHTML = `<span style="color: #8B929B;">✗ Caractere especial</span>`
    }

    if (senha != senhaUpper) {
      senha_minuscula.innerHTML = `<span style="color: #2E9B68;">✓ Letra minúscula</span>`
    } else {
      senha_minuscula.innerHTML = `<span style="color: #8B929B;">✗ Letra minúscula</span>`
    }

    if (senha != senhaLower) {
      senha_maiuscula.innerHTML = `<span style="color: #2E9B68;">✓ Letra maiúscula</span>`
    } else {
      senha_maiuscula.innerHTML = `<span style="color: #8B929B;">✗ Letra maiúscula</span>`
    }

    if (senha.length >= 8) {
      senha_8caracteres.innerHTML = `<span style="color: #2E9B68;">✓ 8+ caracteres</span>`
    } else {
      senha_8caracteres.innerHTML = `<span style="color: #8B929B;">✗ 8+ caracteres</span>`
    }


  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
