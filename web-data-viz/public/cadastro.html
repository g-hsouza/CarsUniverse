<html lang="pt-br">

<head>
  <meta charset="UTF-8" />

<body onload="listar()">

  <div class="formulario">
    <h1>Crie sua <span style="color: #E82127;">conta</span></h1>

    <div class="campos-formulario">
      <div class="campo">
        <label for="ipt_nome">Nome</label>
        <input type="text" id="ipt_nome" placeholder="Nome">
      </div>

      <div class="campo">
        <label for="ipt_email">E-mail</label>
        <input type="text" id="ipt_email" placeholder="nome@email.com">
      </div>

      <div class="campo">
        <label for="ipt_senha">Senha</label>
        <input type="password" id="ipt_senha" onkeyup="mostrarSenha()" placeholder="Digite sua senha">
        <p class="p-senha"><span id="senha_8caracteres">✗ 8+ caracteres</span> | <span id="senha_maiuscula">✗ Letra
            maiúscula</span> | <span id="senha_minuscula">✗ Letra minúscula</span> | <span id="senha_especial">✗
            Caractere especial</span></p>
      </div>

      <div class="campo">
        <label for="ipt_confirmacaoSenha">Confirmar senha</label>
        <input type="password" id="ipt_confirmacaoSenha" placeholder="Confirme a senha">
      </div>
      <div id="div_nulos"></div>
    </div>

    <button class="button-cadastro" onclick="cadastrar()">Cadastrar</button>

    <p class="p-login">Já tem uma conta? <a href="login.html" style="color: #E82127;"><b>Entrar</b></a></p>
  </div>


</body>

</html>

<script>

   function cadastrar(){
        let nome = ipt_nome.value.trim();
        let email = ipt_email.value.trim();
        let temArroba = email.includes('@');
        let temPonto = email.includes('.');
        let indexArroba = email.indexOf('@');
        let indexPontoCom = email.indexOf('.com');
        let senha = ipt_senha.value.trim();
        let senhaUpper = senha.toUpperCase();
        let senhaLower = senha.toLowerCase();
        let temEspecial = senha.includes('!') || senha.includes('*') || senha.includes('.') || senha.includes('@') || senha.includes('#') || senha.includes('$');
        let confirmacaoSenha = ipt_confirmacaoSenha.value.trim();

        let campos = [nome, email, senha, confirmacaoSenha]
        let i = 0;

        let nomeValido = nome.length > 1;
        let emailValido = temArroba && temPonto && indexPontoCom > indexArroba + 1 && indexArroba > 0;
        let senhaValida = senha.length >= 8 && senha != senhaUpper && senha != senhaLower && temEspecial;
        let confirmacaoSenhaValida = confirmacaoSenha == senha;

        for (i = 0; i < campos.length && campos[i] != ''; i++){

        }

        if (i < campos.length){
            div_nulos.innerHTML = `<span style="color: red;">Preencha todos os campos!</span>`
        } else {
             if (!nomeValido){
                alert('O nome não é válido.')
            } else if (!emailValido){
                alert('O e-mail não é válido.')
            } else if (!senhaValida){
                alert('A senha não é valida')
            } else if (!confirmacaoSenhaValida){
                alert('As senhas não coincidem.')
            } else {
                alert('Cadastro realizado com sucesso!')
            }
        }
    }

    function mostrarSenha(){
        let senha = ipt_senha.value.trim();
        let senhaUpper = senha.toUpperCase();
        let senhaLower = senha.toLowerCase();
        let temEspecial = senha.includes('!') || senha.includes('*') || senha.includes('.') || senha.includes('@') || senha.includes('#') || senha.includes('$');

        if (temEspecial){
            senha_especial.innerHTML = `<span style="color: #2E9B68;">✓ Caractere especial</span>`
        } else {
            senha_especial.innerHTML = `<span style="color: #8B929B;">✗ Caractere especial</span>`
        }

        if (senha != senhaUpper){
            senha_minuscula.innerHTML = `<span style="color: #2E9B68;">✓ Letra minúscula</span>`
        } else {
            senha_minuscula.innerHTML = `<span style="color: #8B929B;">✗ Letra minúscula</span>`
        }

        if (senha != senhaLower){
            senha_maiuscula.innerHTML = `<span style="color: #2E9B68;">✓ Letra maiúscula</span>`
        } else {
            senha_maiuscula.innerHTML = `<span style="color: #8B929B;">✗ Letra maiúscula</span>`
        }

        if (senha.length >= 8){
            senha_8caracteres.innerHTML = `<span style="color: #2E9B68;">✓ 8+ caracteres</span>`
        } else {
            senha_8caracteres.innerHTML = `<span style="color: #8B929B;">✗ 8+ caracteres</span>`
        }


    }

  function cadastrar() {
    // aguardar();

    //Recupere o valor da nova input pelo nome do id
    // Agora vá para o método fetch logo abaixo
    var nomeVar = nome_input.value;
    var emailVar = email_input.value;
    var senhaVar = senha_input.value;
    var confirmacaoSenhaVar = confirmacao_senha_input.value;
    var codigoVar = codigo_input.value;
    var idEmpresaVincular

    // Verificando se há algum campo em branco
    if (
      nomeVar == "" ||
      emailVar == "" ||
      senhaVar == "" ||
      confirmacaoSenhaVar == "" ||
      codigoVar == ""
    ) {
      cardErro.style.display = "block";
      mensagem_erro.innerHTML =
        "(Mensagem de erro para todos os campos em branco)";

      finalizarAguardar();
      return false;
    } else {
      setInterval(sumirMensagem, 5000);
    }

    // Verificando se o código de ativação é de alguma empresa cadastrada
    for (let i = 0; i < listaEmpresasCadastradas.length; i++) {
      if (listaEmpresasCadastradas[i].codigo_ativacao == codigoVar) {
        idEmpresaVincular = listaEmpresasCadastradas[i].id
        console.log("Código de ativação válido.");
        break;
      } else {
        cardErro.style.display = "block";
        mensagem_erro.innerHTML = "(Mensagem de erro para código inválido)";
        finalizarAguardar();
      }
    }

    // Enviando o valor da nova input
    fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nomeVar,
        emailServer: emailVar,
        senhaServer: senhaVar,
        idEmpresaVincularServer: idEmpresaVincular
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          cardErro.style.display = "block";

          mensagem_erro.innerHTML =
            "Cadastro realizado com sucesso! Redirecionando para tela de Login...";

          setTimeout(() => {
            window.location = "login.html";
          }, "2000");

          limparFormulario();
          finalizarAguardar();
        } else {
          throw "Houve um erro ao tentar realizar o cadastro!";
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        finalizarAguardar();
      });

    return false;
  }

  // Listando empresas cadastradas 
  function listar() {
    fetch("/empresas/listar", {
      method: "GET",
    })
      .then(function (resposta) {
        resposta.json().then((empresas) => {
          empresas.forEach((empresa) => {
            listaEmpresasCadastradas.push(empresa);

            console.log("listaEmpresasCadastradas")
            console.log(listaEmpresasCadastradas[0].codigo_ativacao)
          });
        });
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
      });
  }

  function sumirMensagem() {
    cardErro.style.display = "none";
  }
</script>
