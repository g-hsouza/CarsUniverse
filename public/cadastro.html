<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Cars Universe</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styleLogin.css">
</head>
<body>
    <div class="formulario">
        <h1>Crie sua <span style="color: #E82127;">conta</span></h1>

        <div class="campos-formulario">
            <div class="campo">
                <label for="ipt_nome">Nome</label>
                <input type="text" id="ipt_nome" placeholder="Nome">
            </div>
            
            <div class="campo">
                <label for="ipt_email">E-mail</label>
                <input type="text" id="ipt_email" placeholder="nome@email.com">
            </div>

            <div class="campo">
                <label for="ipt_senha">Senha</label>
                <input type="password" id="ipt_senha" placeholder="Digite sua senha">
                <p class="p-senha">X 8+ caracteres | X Letra maiúscula | X Letra minúscula | X Caractere especial</p>
            </div>

            <div class="campo">
                <label for="ipt_confirmacaoSenha">Confirmar senha</label>
                <input type="text" id="ipt_confirmacaoSenha" placeholder="Confirme a senha">
            </div>
        </div>

        <button onclick="cadastrar()">Cadastrar</button>

        <p class="p-login">Já tem uma conta? <a href="" style="color: #E82127;"><b>Entrar</b></a></p>
    </div>
    
</body>
</html>
